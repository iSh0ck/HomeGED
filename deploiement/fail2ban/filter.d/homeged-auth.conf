# Filtre fail2ban : échecs d'authentification HomeGED.
#
# Source : le journal d'accès de nginx (format « combined »), seul endroit où
# figure l'adresse réelle du client — l'API, derrière le proxy, ne voit que
# l'adresse du réseau Docker.
#
# Deux codes sont comptés, et c'est délibéré :
#   401  identifiants refusés — la tentative elle-même ;
#   429  refus du limiteur applicatif, déjà déclenché pour cette source. Les
#        compter aussi permet de bannir celui qui continue de frapper après
#        avoir été écarté par l'application ; c'est justement le comportement
#        d'un outil automatique, pas d'un humain qui se trompe de mot de passe.
#
# Ligne type :
# 192.168.1.42 - - [03/Sep/2026:19:02:14 +0000] "POST /api/auth/login HTTP/1.1" 429 74 "-" "curl/8.14.1"

[Definition]

failregex = ^<HOST> -[^"]*"POST /api/auth/login HTTP/[0-9.]+" (401|429) 

ignoreregex =

datepattern = ^[^\[]*\[({DATE})

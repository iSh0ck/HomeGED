[pytest]
# Avertissements : ceux qui viennent de **notre** code sont des erreurs.
#
# Un avertissement de dépréciation dit qu'un appel cessera de fonctionner à une
# version près. Les laisser s'empiler, c'est découvrir la panne le jour de la
# montée de version, quand plus rien ne dit lequel il fallait traiter. Ceux du
# projet font donc échouer la suite : ils se corrigent au moment où on les
# introduit, pas trois mois plus tard.
#
# Ceux des dépendances restent visibles sans bloquer — on ne corrige pas le code
# des autres. Une exception, tue explicitement plutôt que tolérée :
#
#   starlette 1.6.0 (la dernière) référence `anyio.abc.BlockingPortal`, alias que
#   anyio 4.15 déprécie. L'appel est dans *leur* client de test, à l'import ; il
#   n'y a rien à corriger de notre côté, et le laisser s'afficher à chaque
#   exécution finissait par masquer les avertissements qui, eux, nous concernent.
#   Vérifié le 2026-09-04 : aucune version de starlette ne le corrige encore.
#   À retirer dès qu'une le fait — c'est le seul moyen de s'apercevoir qu'elle
#   est sortie.
filterwarnings =
    default
    error::DeprecationWarning:app
    error::PendingDeprecationWarning:app
    ignore:.*anyio\.abc\.BlockingPortal.*:DeprecationWarning

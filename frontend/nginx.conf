server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Journal d'accès en double.
    #
    # Sur la sortie standard, que Docker collecte et fait tourner (10 Mo × 5) —
    # c'est ce qu'on lit avec `docker compose logs frontend`.
    #
    # Et dans un fichier réel, monté depuis l'hôte, pour fail2ban : le fichier de
    # Docker porte l'identifiant du conteneur dans son nom, identifiant qui change
    # à chaque reconstruction, ce qui casserait le chemin surveillé. Ici le chemin
    # est stable et le format est le `combined` standard, que les filtres livrés
    # avec fail2ban savent lire.
    #
    # C'est le seul endroit où figure l'adresse réelle du client : l'API, derrière
    # ce proxy, ne voit que l'adresse du réseau Docker.
    access_log /dev/stdout combined;
    access_log /var/log/homeged/acces.log combined;

    location /api/ {
        # nginx résout normalement le nom de l'amont **une seule fois, au
        # démarrage**. Or le conteneur `api` change d'adresse IP à chaque
        # reconstruction : l'interface restait alors bloquée en 502 jusqu'à ce
        # qu'on redémarre aussi le frontend. En passant par une variable et le
        # résolveur interne de Docker (127.0.0.11), le nom est résolu à chaque
        # requête et le service se rétablit tout seul.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $amont_api api:8000;

        # équivalent du `proxy_pass http://api:8000/` d'origine : on retire le
        # préfixe /api/ avant transmission (proxy_pass avec variable ne le fait pas)
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$amont_api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # En-têtes de sécurité, en défense complémentaire du cookie httpOnly.
    #
    # **Répétés dans chaque `location` qui pose un en-tête à elle** : nginx
    # n'hérite pas des `add_header` d'un niveau supérieur dès que le niveau
    # courant en déclare un. Sans cette répétition, la page elle-même — celle où
    # s'exécute le JavaScript, donc le seul endroit où la CSP sert à quelque
    # chose — était servie sans aucune de ces protections, parce que sa
    # `location` posait un `Cache-Control` (§22.38).
    #
    # La politique de contenu (CSP) est la mesure la plus utile contre le XSS :
    # elle interdit l'exécution de tout script qui ne vient pas du site lui-même,
    # y compris un script injecté dans la page. `style-src` autorise les styles
    # en ligne, que React utilise pour les styles de composants, mais `script-src`
    # ne les autorise pas — c'est là que se joue l'essentiel.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;          # pas d'interprétation d'un type deviné
    add_header Referrer-Policy "same-origin" always;             # aucune URL interne divulguée à un tiers
    add_header X-Frame-Options "DENY" always;                    # pas d'inclusion dans une iframe (clickjacking)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Les fichiers d'`assets/` portent une empreinte dans leur nom : un contenu
    # qui change change de nom. Ils peuvent donc être gardés indéfiniment.
    location /assets/ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;          # pas d'interprétation d'un type deviné
    add_header Referrer-Policy "same-origin" always;             # aucune URL interne divulguée à un tiers
    add_header X-Frame-Options "DENY" always;                    # pas d'inclusion dans une iframe (clickjacking)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        # `index.html`, lui, garde le même nom et désigne les fichiers du moment.
        # Mis en cache, il continue de désigner l'ancien paquet après une mise à
        # jour : l'utilisateur voit alors une version périmée sans le savoir, et
        # aucune correction ne lui parvient tant qu'il ne vide pas son cache.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;          # pas d'interprétation d'un type deviné
    add_header Referrer-Policy "same-origin" always;             # aucune URL interne divulguée à un tiers
    add_header X-Frame-Options "DENY" always;                    # pas d'inclusion dans une iframe (clickjacking)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
